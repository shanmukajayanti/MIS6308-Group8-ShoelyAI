<!doctype html>
<html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shoely AI · Supply Chain Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%235b5bf0'/%3E%3Cpath d='M8 20c4 0 5-6 9-6 3 0 3 3 7 3v3H8z' fill='white'/%3E%3C/svg%3E">
<script>try{var t=localStorage.getItem('shoely-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="/app.css"></head><body>
<nav id="side">
  <div class="brand"><div class="logo" id="logo"></div><div><b>Shoely AI</b><small>Supply chain command center</small></div></div>
  <div id="nav"></div>
  <div class="sidefoot">
    <div class="aicard" id="llm"></div>
    <div class="userbox"><div class="avatar" id="uav">?</div><select id="who" title="Switch manager"></select></div>
  </div>
</nav>
<div class="wrap">
  <div class="topbar">
    <div class="crumbs" id="crumbs"></div>
    <div class="searchbtn" onclick="openPalette()"><span id="sicon"></span>Search or run a command…<span class="kbd">⌘K</span></div>
    <div class="chip-clock" id="clock"></div>
    <button class="iconbtn" id="themebtn" title="Toggle theme" onclick="toggleTheme()"></button>
  </div>
  <main id="main"></main>
</div>
<button id="fab" onclick="toggleChat()"></button>
<aside id="cw">
  <header><div class="ai" id="cwai"></div><div class="sp"><b>Shoely Assistant</b><small id="cwho"></small></div><button onclick="loadChat()" title="Refresh" id="cwr"></button><button onclick="toggleChat()" id="cwx"></button></header>
  <div id="cmsgs"></div><div id="csug"></div>
  <footer><input id="ci" placeholder="Ask about stock, or tell me what to do…" autocomplete="off" onkeydown="if(event.key=='Enter')say()"><button class="pri" onclick="say()" id="csend"></button></footer>
</aside>
<div id="toasts"></div>
<script src="/app.js"></script>
</body></html>
