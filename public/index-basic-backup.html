<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shoely AI</title>
<style>
:root{--bg:#f0f4f4;--card:#fff;--ink:#111827;--mut:#6b7280;--line:#e5e7eb;--side:#0f172a;--pri:#2352d8;--ok:#047857;--okb:#d1fae5;--warn:#b45309;--warnb:#fef3c7;--bad:#b91c1c;--badb:#fee2e2;--infob:#dbeafe;--info:#1d4ed8}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh}
nav{width:215px;background:var(--side);color:#cbd5e1;padding:14px 10px;position:sticky;top:0;height:100vh;flex-shrink:0;display:flex;flex-direction:column}
nav h1{color:#fff;font-size:18px;margin:4px 8px 14px}nav h1 small{display:block;font-size:11px;color:#94a3b8;font-weight:400}
nav a{display:flex;justify-content:space-between;padding:8px 10px;border-radius:6px;cursor:pointer;color:#cbd5e1}nav a:hover,nav a.on{background:#1e293b;color:#fff}
.badge{background:var(--pri);color:#fff;border-radius:9px;padding:0 7px;font-size:11px}
nav .who{margin-top:auto;font-size:12px;color:#94a3b8}nav select{width:100%;margin-top:4px;background:#1e293b;color:#fff;border:0;padding:6px;border-radius:6px}
main{flex:1;padding:20px 24px;min-width:0}h2{margin:0}.sub{color:var(--mut);margin:2px 0 14px}
.grid{display:grid;gap:12px}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:3fr 2fr}
@media(max-width:900px){.g4,.g2{grid-template-columns:1fr 1fr}nav{width:150px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:14px}.kpi b{font-size:26px;display:block}.kpi span{color:var(--mut);font-size:12px}
table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;color:var(--mut);font-size:11px;text-transform:uppercase;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:7px 8px;border-bottom:1px solid #f1f5f9;vertical-align:top}tr.click{cursor:pointer}tr.click:hover,tr.sel{background:#f1f5f9}
.pill{display:inline-block;padding:1px 8px;border-radius:9px;font-size:11px;font-weight:600;background:#e5e7eb;color:#374151;white-space:nowrap}
.ok{background:var(--okb);color:var(--ok)}.warn{background:var(--warnb);color:var(--warn)}.bad{background:var(--badb);color:var(--bad)}.info{background:var(--infob);color:var(--info)}
button{font:inherit;padding:6px 12px;border-radius:6px;border:1px solid var(--line);background:#fff;cursor:pointer}button.pri{background:var(--pri);color:#fff;border-color:var(--pri)}button.bad{background:#fff;color:var(--bad);border-color:#fca5a5}button:disabled{opacity:.5}
input,select,textarea{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:#fff}textarea{width:100%}
.kv{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #f1f5f9}.mut{color:var(--mut)}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.low{color:var(--bad);font-weight:700}#toast{position:fixed;bottom:18px;right:18px;background:#111827;color:#fff;padding:10px 14px;border-radius:8px;display:none;max-width:420px;z-index:9}
.chat{height:56vh;overflow:auto;background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:78%;padding:8px 12px;border-radius:12px;white-space:pre-wrap}.me{align-self:flex-end;background:var(--pri);color:#fff}.bot{align-self:flex-start;background:#fff;border:1px solid var(--line)}
.chip{font-size:11px;background:#eef2ff;color:#4338ca;border-radius:8px;padding:1px 7px;margin-right:4px}.sug{cursor:pointer;border:1px solid var(--line);border-radius:14px;padding:3px 10px;font-size:12px;background:#fff}
pre{background:#0f172a;color:#e2e8f0;padding:10px;border-radius:6px;white-space:pre-wrap;font-size:12px;margin:6px 0}
#fab{position:fixed;right:22px;bottom:22px;width:56px;height:56px;border-radius:50%;background:var(--pri);color:#fff;border:0;font-size:24px;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:20;cursor:pointer}
#cw{position:fixed;right:22px;bottom:90px;width:400px;max-width:calc(100vw - 30px);height:560px;max-height:calc(100vh - 110px);background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.28);display:none;flex-direction:column;z-index:20;overflow:hidden}
#cw.open{display:flex}#cw header{background:var(--side);color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:center}#cw header small{display:block;color:#94a3b8;font-size:11px}
#cw header button{background:none;border:0;color:#cbd5e1;font-size:18px;padding:0 4px}
#cmsgs{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px;background:#f8fafc}#cw .msg{max-width:88%;font-size:13px}
#csug{display:flex;gap:6px;overflow-x:auto;padding:6px 10px;border-top:1px solid var(--line)}#csug .sug{white-space:nowrap}
#cw footer{display:flex;gap:6px;padding:8px 10px;border-top:1px solid var(--line)}#cw footer input{flex:1}
</style></head><body>
<nav><h1>Shoely AI<small>Agentic inventory & supply chain</small></h1><div id="nav"></div>
<div class="who">Signed in as<select id="who"></select><div id="llm" style="margin-top:8px"></div></div></nav>
<main id="main">Loading…</main>
<button id="fab" title="Ask Shoely" onclick="toggleChat()">💬</button>
<div id="cw"><header><div>Shoely Assistant<small id="cwho"></small></div><div><button title="Clear view" onclick="loadChat()">⟳</button><button onclick="toggleChat()">✕</button></div></header>
<div id="cmsgs"></div><div id="csug"></div><footer><input id="ci" placeholder="Ask about stock or give an instruction" onkeydown="if(event.key=='Enter')say()"><button class="pri" onclick="say()">Send</button></footer></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s);let META,page='dashboard',sel={},chatLog=[];
const api=async(p,b)=>{const r=await fetch('/api'+p,b===undefined?{}:{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)});const j=await r.json();if(j.error&&!r.ok)throw new Error(j.error);return j};
const toast=t=>{const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',4200)};
const act=async(fn,msg)=>{try{const r=await fn();if(msg)toast(typeof msg==='function'?msg(r):msg);await render();return r}catch(e){toast('⚠ '+e.message)}};
const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const fmtD=n=>new Date(Date.now()+(META.clockOffsetHours*3600e3)+n*86400e3).toLocaleString('en-US',{month:'long',day:'numeric'});
const money=n=>n==null?'—':'$'+Number(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const ago=iso=>{const h=(Date.now()+META.clockOffsetHours*3600e3-new Date(iso))/3600e3;return h<1?Math.round(h*60)+'m ago':h<48?Math.round(h)+'h ago':Math.round(h/24)+'d ago'};
const PILL={Pending:'warn','Pending Manager Review':'warn','Pending Auto Approval':'info',Approved:'ok','PO Issued':'ok',Rejected:'bad','On Hold':'bad',Flagged:'bad','Returned For Revision':'info','Handed Off':'info',delayed:'bad',critical:'bad',moderate:'warn',minor:'info',high:'bad',medium:'warn',low:'info',sent:'info',shipped:'ok',delivered:'ok',in_production:'info',acknowledged:'info',open:'warn',resolved:'ok',pending_documentation:'bad','Deadstock Risk':'bad',Overstock:'warn',Sent:'ok',High:'ok',Medium:'warn',Low:'bad',Unreliable:'bad','Reorder Recommended':'warn','No Reorder':'ok','Flagged For Review':'bad'};
const pill=s=>`<span class="pill ${PILL[s]||''}">${esc(String(s).replace(/_/g,' '))}</span>`;
const mgr=()=>META.managers.find(m=>m.manager_id==$('#who').value)||META.managers[0];
const myStore=()=>mgr().store_id||1;
const PAGES=[['dashboard','Dashboard'],['monitoring','Monitoring'],['forecasts','Forecasts'],['requisitions','Requisitions'],['orders','Purchase orders'],['receiving','Receiving'],['stock','Stock health'],['system','System']];

async function boot(){META=await api('/meta');$('#who').innerHTML=META.managers.map(m=>`<option value="${m.manager_id}">${m.manager_name} · ${m.role}</option>`).join('');$('#who').onchange=()=>{render();if($('#cw').classList.contains('open'))loadChat()};render()}
async function render(){
  META=await api('/meta');$('#llm').innerHTML=META.llm?`<span class="pill ok">Claude: ${META.llm}</span>`:`<span class="pill warn">No API key · fallback mode</span>`;
  const d=await api('/dashboard');const badge={monitoring:d.kpis.pendingRecs,requisitions:d.kpis.pendingReqs,orders:d.kpis.delayedPOs,stock:d.kpis.stockFlags};
  $('#nav').innerHTML=PAGES.map(([k,l])=>`<a class="${k==page?'on':''}" onclick="go('${k}')">${l}${badge[k]?`<span class="badge">${badge[k]}</span>`:''}</a>`).join('');
  $('#main').innerHTML=await V[page](d);if(V[page+'After'])V[page+'After']();
}
const go=p=>{page=p;render()};

const recTable=(rows,actions)=>`<table><tr><th>ID</th><th>Item</th><th>Store</th><th>On hand/min</th><th>Suggest</th><th>Status</th>${actions?'<th></th>':''}</tr>${rows.map(r=>`<tr><td>RR-${r.recommendation_id}</td><td>${esc(r.item_name)}<div class="mut">Size ${r.size} · ${esc(r.colorway)}</div></td><td>${esc(r.store_name)}</td><td><span class="low">${r.quantity_on_hand}</span> / ${r.reorder_threshold}</td><td>${r.suggested_quantity}${r.review_flag=='Yes'?' '+pill('review'):''}<div class="mut" style="max-width:300px">${esc(r.rationale||'')}</div></td><td>${pill(r.recommendation_status)}</td>${actions?`<td>${r.recommendation_status=='Pending'?`<button class="pri" onclick="approveRec(${r.recommendation_id})">Approve</button> <button class="bad" onclick="rejectRec(${r.recommendation_id})">Reject</button>`:''}</td>`:''}</tr>`).join('')||'<tr><td colspan=7 class="mut">None yet — run monitoring.</td></tr>'}</table>`;
const approveRec=id=>act(()=>api(`/recommendations/${id}/approve`,{managerId:mgr().manager_id}),r=>`RR-${id} approved → ${r.draft.decision}${r.draft.poId?' · PO-'+r.draft.poId:''}${r.draft.note?' ('+r.draft.note+')':''}`);
const rejectRec=id=>{const reason=prompt('Reason (optional)');if(reason===null)return;act(()=>api(`/recommendations/${id}/reject`,{managerId:mgr().manager_id,reason}),`RR-${id} rejected`)};
const runMon=periodic=>act(()=>api('/monitoring/run',{periodic}),r=>`Checked ${r.checked}: ${r.reorderRecommended} new recommendations, ${r.flagged} flagged`);

const V={
async dashboard(d){const k=d.kpis;return `<h2>Dashboard</h2><div class="sub">${META.today} · approval limit ${money(META.approvalLimit)} · <button class="pri" onclick="runMon(false)">Run monitoring now</button> <button onclick="runMon(true)">Periodic review</button></div>
<div class="grid g4"><div class="card kpi"><b>${k.pendingRecs}</b>Reorder recommendations<br><span>${k.reviewRecs} flagged for review</span></div><div class="card kpi"><b>${k.openPOs}</b>Open purchase orders<br><span>${k.delayedPOs} delayed</span></div><div class="card kpi"><b>${k.pendingReqs}</b>Requisitions needing action<br><span>review / on hold / flagged</span></div><div class="card kpi"><b>${k.stockFlags}</b>Stock health flags<br><span>${k.deadstock} deadstock risk</span></div></div>
<div class="grid g2"><div><div class="card"><h3>Reorder recommendations awaiting review</h3>${recTable(d.recs,true)}</div><div class="card"><h3>Monitoring log</h3><table>${d.log.map(l=>`<tr><td>${pill(l.monitor_result)}</td><td>${esc(l.item_name)} · ${l.size} @ ${esc(l.store_name)}<div class="mut">${esc(l.detail||'')}</div></td><td class="mut">${ago(l.log_at)}</td></tr>`).join('')}</table></div></div>
<div><div class="card"><h3>Purchase orders needing attention</h3>${d.pos.map(p=>`<div class="kv"><span><a href="#" onclick="sel.po=${p.po_id};go('orders');return false">PO-${p.po_id}</a> ${esc(p.supplier_name)}<div class="mut">Delivery ${p.expected_delivery_date}</div></span>${pill(p.status)}</div>`).join('')||'<span class="mut">None</span>'}</div>
<div class="card"><h3>Notifications</h3>${d.notifications.map(n=>`<div class="kv"><span>${esc(n.subject)}<div class="mut">${esc((n.body||'').slice(0,110))}</div></span><span class="mut">${ago(n.sent_at)}</span></div>`).join('')}</div></div></div>`},

async monitoring(){const [recs,inv]=await Promise.all([api('/recommendations'),api('/inventory')]);return `<h2>Inventory monitoring</h2><div class="sub">Threshold-breach and periodic-review detection · <button class="pri" onclick="runMon(false)">Run monitoring</button></div>
<div class="card"><h3>Reorder recommendations</h3>${recTable(recs,true)}</div>
<div class="card"><h3>Inventory & monitoring parameters</h3><table><tr><th>Item</th><th>Store</th><th>On hand</th><th>Threshold</th><th>Forecast 30d</th><th>Updated</th><th></th></tr>${inv.map(r=>`<tr><td>${esc(r.item_name)} · ${r.size}</td><td>${esc(r.store_name)}</td><td class="${r.reorder_threshold!=null&&r.quantity_on_hand<=r.reorder_threshold?'low':''}">${r.quantity_on_hand}</td><td>${r.reorder_threshold??pill('missing')}</td><td>${r.forecast??'—'}</td><td class="mut">${ago(r.last_updated_at)}</td><td><button onclick="setTh(${r.item_id},${r.store_id},${r.reorder_threshold||0})">Set threshold</button></td></tr>`).join('')}</table></div>`},

async forecasts(){const inv=await api('/inventory');sel.f=sel.f||`${inv[0].item_id}/${inv[0].store_id}`;const d=await api('/forecast/'+sel.f),f=d.forecast,mx=Math.max(1,...d.weeks.map(w=>w.units));
return `<h2>Demand forecast</h2><div class="sub"><select onchange="sel.f=this.value;render()">${inv.map(r=>`<option value="${r.item_id}/${r.store_id}" ${sel.f==r.item_id+'/'+r.store_id?'selected':''}>${esc(r.item_name)} · ${r.size} @ ${esc(r.store_name)}</option>`).join('')}</select> <button onclick="act(()=>api('/forecast/${sel.f}?force=1'),'Forecast regenerated')">Request new forecast</button></div>
<div class="grid g2"><div class="card"><h3>Weekly units sold (last 12 weeks)</h3><svg viewBox="0 0 480 160" width="100%">${d.weeks.map((w,i)=>`<rect x="${i*38+6}" y="${150-w.units/mx*135}" width="30" height="${w.units/mx*135}" fill="#2352d8" rx="2"/><text x="${i*38+21}" y="158" font-size="8" text-anchor="middle" fill="#6b7280">${w.week}</text><text x="${i*38+21}" y="${146-w.units/mx*135}" font-size="9" text-anchor="middle">${w.units}</text>`).join('')}</svg></div>
<div class="card"><h3>Prediction</h3><b style="font-size:30px">${f.predicted_demand??'n/a'}</b> pairs · ${f.period_start} → ${f.period_end}<div style="margin:8px 0">${pill(f.forecast_confidence)} ${f.review_flag=='Yes'?pill('review flag'):''} ${f.outdated_flag=='Yes'?pill('outdated'):''}</div><p>${esc(f.forecast_justification)}</p><div class="kv"><span class="mut">Model</span><span>${esc(f.model_version)}</span></div></div></div>`},

async requisitions(){const rs=await api('/requisitions');sel.req=sel.req||(rs.find(r=>r.requisition_status=='Pending Manager Review')||rs[0])?.requisition_id;const r=sel.req?await api('/requisitions/'+sel.req):null;
let det='';if(r){const sups=r.lines[0]?await api('/suppliers/'+r.lines[0].item_id):[];const canDecide=r.requisition_status=='Pending Manager Review';
det=`<div class="card"><h3>REQ-${r.requisition_id} ${pill(r.requisition_status)}</h3>${r.lines.map(l=>`<div class="kv"><span>${esc(l.item_name)} · Size ${l.size} · ${l.recommended_quantity} pairs @ ${money(l.unit_price)}</span><b>${money(l.recommended_quantity*l.unit_price)}</b></div><p class="mut">${esc(l.forecast_justification)}</p>`).join('')}
<div class="kv"><span>Supplier</span><span>${esc(r.supplier_name||'—')} ${r.supplier_valid_flag=='No'?pill('invalid'):''}</span></div><div class="kv"><span>Total / limit</span><span>${money(r.total_estimated_cost)} / ${money(r.approval_limit)}</span></div><div class="kv"><span>Approval method</span><span>${r.approval_method||'—'}</span></div>${r.status_note?`<p class="mut">⚠ ${esc(r.status_note)}</p>`:''}${r.forecast?`<div class="kv"><span>Forecast</span><span>${r.forecast.predicted_demand} (${r.forecast.forecast_confidence})</span></div>`:''}
${canDecide?`<textarea id="reason" rows="2" placeholder="Reason (required to reject / return)"></textarea><div class="row" style="margin-top:6px"><button class="pri" onclick="decide(${r.requisition_id},'Approved')">Approve & issue PO</button><button onclick="decide(${r.requisition_id},'Returned For Revision')">Return for revision</button><button class="bad" onclick="decide(${r.requisition_id},'Rejected')">Reject</button></div>`:''}
${['On Hold','Flagged','Returned For Revision','Rejected'].includes(r.requisition_status)&&r.recommendation_id?`<div class="row" style="margin-top:8px"><select id="sup">${sups.map(s=>`<option value="${s.supplier_id}" ${s.supplier_valid_flag=='No'?'disabled':''}>${esc(s.supplier_name)} ${money(s.unit_price)}${s.supplier_valid_flag=='No'?' (invalid)':''}</option>`).join('')}</select><button onclick="act(()=>api('/requisitions/${r.requisition_id}/revise',{supplierId:+$('#sup').value}),x=>'Agent revised → '+x.decision)">Agent: revise requisition</button></div>`:''}
${r.po?`<p>→ <a href="#" onclick="sel.po=${r.po.po_id};go('orders');return false">PO-${r.po.po_id}</a> (${r.po.status})</p>`:''}
${r.decisions.length?`<h3 style="margin-top:10px">Decision history</h3>${r.decisions.map(d=>`<div class="kv"><span>${pill(d.decision_type)} ${esc(d.manager_name||'Auto')} ${d.reason?'— '+esc(d.reason):''}</span><span class="mut">${ago(d.reviewed_at)}</span></div>`).join('')}`:''}</div>`}
return `<h2>Requisitions & approvals</h2><div class="sub">Within-limit, high-confidence requisitions auto-approve; everything else lands here.</div><div class="grid g2"><div class="card"><table><tr><th>ID</th><th>Items</th><th>Cost</th><th>Status</th></tr>${rs.map(x=>`<tr class="click ${sel.req==x.requisition_id?'sel':''}" onclick="sel.req=${x.requisition_id};render()"><td>REQ-${x.requisition_id}</td><td>${esc(x.items||'—')}<div class="mut">${esc(x.store_name)}</div></td><td>${money(x.total_estimated_cost)}</td><td>${pill(x.requisition_status)}</td></tr>`).join('')}</table></div><div>${det}</div></div>`},

async orders(){const ps=await api('/purchase-orders');sel.po=sel.po||ps[0]?.po_id;const p=sel.po?await api('/purchase-orders/'+sel.po):null;let det='';
if(p)det=`<div class="card"><h3>PO-${p.po_id} · ${esc(p.supplier_name)} ${pill(p.status)}</h3><div class="kv"><span>Channel</span><span>${p.preferred_channel}</span></div><div class="kv"><span>Expected ship / delivery</span><span>${p.expected_ship_date} / ${p.expected_delivery_date}</span></div><div class="kv"><span>Total</span><span>${money(p.total_amount)}</span></div>${p.lines.map(l=>`<div class="kv"><span>${esc(l.item_name)} · ${l.size}</span><span>${l.quantity_ordered} × ${money(l.unit_price)}</span></div>`).join('')}
${p.delayFlags.map(f=>`<div class="card" style="background:#fef2f2;margin:8px 0 0">${pill(f.severity)} <b>${f.delay_days} days late</b> → ${f.revised_date}<div class="mut">${esc(f.notes||'')}</div>${f.acknowledged_by?'<span class="pill ok">acknowledged</span>':`<button onclick="act(()=>api('/delay-flags/${f.flag_id}/acknowledge',{managerId:mgr().manager_id}),'Acknowledged')">Acknowledge</button>`}</div>`).join('')}
${p.alerts.map(a=>`<div class="mut">🔔 ${pill(a.priority)} ${esc(a.manager_name||'')}: ${esc(a.message)}</div>`).join('')}</div>
<div class="card"><h3>Simulate supplier reply (parsed by ${META.llm?'Claude':'rule-based parser'})</h3><textarea id="smsg" rows="3">Hi team, production ran behind. We now expect to ship around ${fmtD(25)} and delivery should be about ${fmtD(35)}. Sorry for the trouble.</textarea><div class="row" style="margin-top:6px"><button class="pri" onclick="act(()=>api('/purchase-orders/${p.po_id}/supplier-message',{text:$('#smsg').value}),r=>'Agent: '+r.decision+(r.severity?' ('+r.severity+', '+r.delayDays+'d)':''))">Send</button><button onclick="$('#smsg').value='Thanks, we confirm receipt of your order and it is now in production.'">Preset: ack</button><button onclick="$('#smsg').value='Will advise soon.'">Preset: vague</button></div></div>
<div class="card"><h3>Correspondence</h3>${p.correspondence.map(c=>`<div class="mut">${pill(c.tone)} via ${c.channel} · ${ago(c.created_at)}</div><pre>${esc(c.body)}</pre>`).join('')}${p.updates.map(u=>`<div class="kv"><span>${u.reported_status?pill(u.reported_status):pill('unparsed')} ship ${u.reported_ship_date||'—'} · delivery ${u.reported_delivery_date||'—'}<div class="mut">${esc((u.raw_text||'').slice(0,100))}</div></span><span class="mut">${ago(u.update_timestamp)}</span></div>`).join('')}</div>`;
return `<h2>Purchase orders</h2><div class="sub">Transmission, supplier-reply parsing, delay severity and escalation timers.</div><div class="grid g2"><div class="card"><table><tr><th>PO</th><th>Supplier / items</th><th>Delivery</th><th>Status</th></tr>${ps.map(x=>`<tr class="click ${sel.po==x.po_id?'sel':''}" onclick="sel.po=${x.po_id};render()"><td>PO-${x.po_id}</td><td>${esc(x.supplier_name)}<div class="mut">${esc(x.items||'')} @ ${esc(x.store_name)}</div></td><td>${x.expected_delivery_date}</td><td>${pill(x.status)}</td></tr>`).join('')}</table></div><div>${det}</div></div>`},

async receiving(){const ps=(await api('/purchase-orders')).filter(p=>['sent','acknowledged','in_production','shipped','delayed'].includes(p.status));const ds=await api('/discrepancies');sel.rp=sel.rp||ps[0]?.po_id;const p=sel.rp?await api('/purchase-orders/'+sel.rp):null;
return `<h2>Receiving & reconciliation</h2><div class="sub">Log what arrived; the agent reconciles against the PO and routes exceptions. Damage claims need photo evidence.</div><div class="grid g2"><div class="card"><h3>Receive shipment</h3>${p?`<select onchange="sel.rp=this.value;render()">${ps.map(x=>`<option value="${x.po_id}" ${x.po_id==sel.rp?'selected':''}>PO-${x.po_id} · ${esc(x.supplier_name)}</option>`).join('')}</select><table><tr><th>Item</th><th>Ordered</th><th>Received</th><th>Condition</th><th>Photo</th></tr>${p.lines.map(l=>`<tr data-item="${l.item_id}"><td>${esc(l.item_name)} · ${l.size}</td><td>${l.quantity_ordered}</td><td><input class="q" type="number" min="0" value="${l.quantity_ordered}" style="width:70px"></td><td><select class="c"><option>good</option><option>partial_damage</option><option>damaged</option></select></td><td><input class="ph" type="checkbox"></td></tr>`).join('')}</table><p><button class="pri" onclick="receive()">Submit receipt</button></p><div id="rcpt"></div>`:'<span class="mut">No open POs.</span>'}</div>
<div class="card"><h3>Discrepancies</h3>${ds.map(d=>`<div class="card" style="margin:0 0 8px"><b>DS-${d.discrepancy_id}</b> ${pill(d.discrepancy_type)} ${pill(d.severity)} ${pill(d.status)}<div>${esc(d.summary)}</div><div class="mut">Recommended: ${d.recommended_action.replace(/_/g,' ')} ${d.routed_to?'· routed to '+esc(d.routed_to):''}</div>${d.status=='pending_documentation'?`<button onclick="act(()=>api('/discrepancies/${d.discrepancy_id}/photo',{photo:'evidence.jpg'}),'Photo attached & routed')">Attach photo</button>`:''}${['open','escalated','under_review'].includes(d.status)?`<button class="pri" onclick="act(()=>api('/discrepancies/${d.discrepancy_id}/resolve',{managerId:mgr().manager_id,action:'${d.recommended_action}'}),'Resolved')">Approve: ${d.recommended_action.replace(/_/g,' ')}</button>`:''}</div>`).join('')||'<span class="mut">None.</span>'}</div></div>`},

async stock(){const fl=await api('/stock-flags');return `<h2>Stock health</h2><div class="sub">Days of supply = on hand ÷ forecast daily demand. >90 → overstock; >180 or no sales in 90 days → deadstock risk. <button class="pri" onclick="act(()=>api('/stock-health/run',{}),r=>r.flagged+' items flagged, '+r.excluded+' excluded')">Run analysis</button></div><div class="card"><table><tr><th>Item</th><th>Store</th><th>On hand</th><th>Forecast</th><th>Days of supply</th><th>Flag</th><th></th></tr>${fl.map(f=>`<tr><td>${esc(f.item_name)} · ${f.size}</td><td>${esc(f.store_name)}</td><td>${f.quantity_on_hand}</td><td>${f.forecasted_demand}</td><td>${f.days_of_supply??'∞'}</td><td>${pill(f.flag_type)}</td><td>${f.acknowledged_by?'<span class="mut">acknowledged</span>':`<button onclick="act(()=>api('/stock-flags/${f.flag_id}/acknowledge',{managerId:mgr().manager_id}),'Acknowledged')">Acknowledge</button>`}</td></tr>`).join('')||'<tr><td colspan=7 class="mut">No flags yet — run the analysis.</td></tr>'}</table></div>`},

async system(){const [tables,llm,notes,alog]=await Promise.all([api('/schema'),api('/llm-log'),api('/notifications'),api('/action-log')]);
return `<h2>System</h2><div class="sub">Demo controls & transparency</div><div class="grid g2"><div><div class="card"><h3>Simulated clock</h3><p class="mut">SLA timers (24h supplier ack, 4h critical escalation, 24/48h requisition review, 48h discrepancy) run on a simulated clock. Offset: +${META.clockOffsetHours}h</p><div class="row"><button onclick="adv(4)">+4h</button><button onclick="adv(24)">+24h</button><button onclick="adv(48)">+48h</button><button onclick="act(()=>api('/tick',{}),r=>r.actions.join('; ')||'No timers fired')">Run timers</button></div></div>
<div class="card"><h3>Approval limit</h3><div class="row"><input id="lim" type="number" value="${META.approvalLimit}"><button onclick="act(()=>api('/settings/approval-limit',{value:+$('#lim').value}),'Limit updated')">Save</button></div></div>
<div class="card"><h3>Notifications</h3>${notes.slice(0,12).map(n=>`<div class="kv"><span>${pill(n.kind)} ${esc(n.subject)}<div class="mut">to ${esc(n.manager_name)}</div></span><span class="mut">${ago(n.sent_at)}</span></div>`).join('')}</div>
<div class="card"><h3>Action log</h3>${alog.slice(0,12).map(a=>`<div class="kv"><span>${pill(a.intent)} ${esc(a.action_details)}<div class="mut">${esc(a.manager_name||'system')}</div></span><span class="mut">${ago(a.logged_at)}</span></div>`).join('')}</div>
<div class="card"><h3>LLM call audit</h3>${llm.map(l=>`<div class="kv"><span>${l.ok?pill('ok'):pill('failed')} ${l.kind}<div class="mut">${esc(l.prompt)}</div></span><span class="mut">${ago(l.created_at)}</span></div>`).join('')||'<span class="mut">No LLM calls (no API key).</span>'}</div></div>
<div><div class="card"><h3>Database (SQLite)</h3>${tables.map(t=>`<div class="kv"><span>${t.table}</span><span>${t.rows}</span></div>`).join('')}</div><button class="bad" onclick="if(confirm('Reset all data to the seed?'))act(()=>api('/reset',{}),'Reset')">Reset demo data</button></div></div>`}
};
const adv=h=>act(()=>api('/clock/advance',{hours:h}),r=>`+${h}h · ${r.actions.join('; ')||'no timers fired'}`);
const setTh=(i,s,c)=>{const v=prompt('Reorder threshold',c||'');if(v!==null&&v!=='')act(()=>api('/monitoring/threshold',{itemId:i,storeId:s,threshold:+v,managerId:mgr().manager_id}),'Threshold saved')};
const decide=(id,t)=>act(()=>api(`/requisitions/${id}/decide`,{managerId:mgr().manager_id,decision:t,reason:$('#reason')?.value}),r=>`REQ-${id}: ${r.requisition_status}${r.po?' · PO-'+r.po.po_id:''}`);
const receive=()=>{const lines=[...document.querySelectorAll('tr[data-item]')].map(tr=>({itemId:+tr.dataset.item,qty:+tr.querySelector('.q').value,condition:tr.querySelector('.c').value,photo:tr.querySelector('.ph').checked?'photo.jpg':null}));
  act(()=>api('/receipts',{poId:+sel.rp,lines,receivedBy:'CLK-004'}),r=>r.summary)};
const SUGG=['What is low on stock at my store?','Show pending recommendations','Approve the reorder for Trail Runner 2 size 10','Where is PO-1?','Show overstock items','Set the reorder threshold for Coast Slide size 8 to 12'];
const bubble=(r,t,tools)=>`<div class="msg ${r}">${esc(t)}${tools?.length?`<div style="margin-top:6px">${tools.map(x=>`<span class="chip">⚙ ${x.tool}</span>`).join('')}</div>`:''}</div>`;
const scrollChat=()=>{const c=$('#cmsgs');c.scrollTop=c.scrollHeight};
async function loadChat(){const h=await api('/chat/history?manager='+mgr().manager_id);$('#cwho').textContent=`${mgr().manager_name} · ${META.llm||'fallback mode'}`;
  $('#cmsgs').innerHTML=h.flatMap(m=>[bubble('me',m.message_text),m.reply_text?bubble('bot',m.reply_text):'']).join('')||'<span class="mut">Ask about stock, approvals, POs… I can also take actions for you.</span>';
  $('#csug').innerHTML=SUGG.map(x=>`<span class="sug" onclick="say(this.textContent)">${esc(x)}</span>`).join('');scrollChat()}
function toggleChat(){const w=$('#cw');w.classList.toggle('open');if(w.classList.contains('open')){loadChat();$('#ci').focus()}}
async function say(t){const i=$('#ci');t=t||i.value.trim();if(!t)return;const c=$('#cmsgs');c.insertAdjacentHTML('beforeend',bubble('me',t)+'<div class="msg bot" id="typing">Thinking…</div>');scrollChat();i.value='';
  try{const r=await api('/chat',{managerId:mgr().manager_id,storeId:myStore(),text:t});$('#typing').outerHTML=bubble('bot',r.reply,r.tools);scrollChat();if(r.tools?.some(x=>!['query_inventory','list_pending','get_forecast','get_order_status','get_requisition','list_stock_flags'].includes(x.tool)))render()}
  catch(e){$('#typing').textContent='⚠ '+e.message}}
boot();
</script></body></html>
